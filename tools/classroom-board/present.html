<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Präsentation · Classroom Board</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,Arial;color:#503d51}.viewport{position:fixed;inset:0;overflow:hidden;background:#eee}.world{position:absolute;width:6000px;height:4000px;transform-origin:0 0;background:#fff;background-image:radial-gradient(#d9cbd8 1.2px,transparent 1.2px);background-size:24px 24px}.world.lined{background-image:repeating-linear-gradient(#fff 0,#fff 31px,#eadde9 32px)}.world.grid{background-image:linear-gradient(#eadde9 1px,transparent 1px),linear-gradient(90deg,#eadde9 1px,transparent 1px);background-size:32px 32px}.world.boardgreen{background:#315b4b}.ink{position:absolute;inset:0;width:6000px;height:4000px}.item{position:absolute;border-radius:16px;overflow:hidden}.sticky{background:#fff0a9}.textitem,.widget{background:#fff}.body{padding:10px}.badge,.phase,.freeze{position:fixed;z-index:10;padding:9px 13px;border-radius:13px;font-weight:900;box-shadow:0 8px 25px #0002}.badge{right:16px;top:16px;background:#fff}.phase{left:16px;bottom:16px;background:#fff}.freeze{left:16px;top:16px;background:#66516c;color:#fff}.traffic{position:fixed;z-index:10;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:#59b887;box-shadow:0 0 0 8px #fff,0 8px 30px #0002}.offline{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff;text-align:center}.hidden{display:none!important}</style></head><body><div class="viewport"><div class="world" id="world"><canvas class="ink" id="ink" width="6000" height="4000"></canvas></div></div><div class="badge">✨ Kathleens Classroom</div><div class="freeze hidden" id="freeze">⏸ Beamer eingefroren</div><div class="phase" id="phase">Unterricht</div><div class="traffic" id="traffic"></div><div class="offline hidden" id="offline"><div><h1>Classroom nicht gefunden</h1><p>Bitte die Beamer-Ansicht erneut aus dem Teacher Board öffnen.</p></div></div><script>(()=>{'use strict';const $=s=>document.querySelector(s),SB='https://fzqxnjhuvgpgovcovosl.supabase.co/rest/v1/rpc/',KEY='sb_publishable_GIyyWoyaQXipaA4S9OuTyQ_cZn7LUgV',world=$('#world'),canvas=$('#ink'),ctx=canvas.getContext('2d'),room=(new URLSearchParams(location.search).get('room')||'').toUpperCase();document.title=room?'Raum '+room+' · Präsentation':'Präsentation';async function rpc(n,b){const r=await fetch(SB+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}function draw(strokes){ctx.clearRect(0,0,6000,4000);ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes||[]){ctx.beginPath();ctx.strokeStyle=s.color||'#6d4d73';ctx.lineWidth=s.width||4;ctx.globalAlpha=s.alpha||1;(s.points||[]).forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}ctx.globalAlpha=1}function render(b,v){if(!b)return;world.className='world '+(b.bg||'');world.querySelectorAll('.item').forEach(e=>e.remove());for(const o of b.items||[]){const e=document.createElement('div');e.className='item '+(o.type==='sticky'?'sticky':o.type==='text'?'textitem':'widget');e.style.cssText='left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;height:'+o.h+'px';e.innerHTML='<div class="body">'+o.html+'</div>';world.appendChild(e)}draw(b.strokes||[]);const z=v?.scale||b.viewport?.scale||.65,x=v?.tx??b.viewport?.tx??-500,y=v?.ty??b.viewport?.ty??-350;world.style.transform='translate('+x+'px,'+y+'px) scale('+z+')'}async function poll(){try{const s=await rpc('classroom_presentation_state',{p_room_code:room});if(!s.ok){$('#offline').classList.remove('hidden');return}$('#offline').classList.add('hidden');$('#freeze').classList.toggle('hidden',!s.frozen);$('#phase').textContent=({explain:'👀 Erklärung',solo:'✏️ Einzelarbeit',group:'👥 Gruppenarbeit',class:'✨ Klassenaufgabe',break:'☕ Pause',free:'Unterricht'})[s.phase]||s.phase;$('#traffic').style.background=({green:'#59b887',yellow:'#f2c75a',red:'#df6a75'})[s.traffic]||'#59b887';render(s.board_state,s.viewport)}catch(e){console.warn(e)}}poll();setInterval(poll,1800)})();</script></body></html>
