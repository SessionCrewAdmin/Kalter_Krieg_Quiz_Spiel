<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Classroom Board · Kathleens Kiste</title><link rel="stylesheet" href="board.css"></head><body><div class="app"><header class="top"><b class="brand">✨ Classroom Board</b><button class="pill primary" id="roomBtn">Klassenraum starten</button><button class="pill" id="studentsBtn">👩‍🎓 Schüler</button><button class="pill primary" id="libraryBtn">✨ Widgets</button><div class="grow"></div><span id="saveState">bereit</span><button class="pill" id="saveBtn">💾</button><button class="pill" id="exportBtn">⬇</button><button class="pill" id="backBtn">← Tools</button></header><div class="stage" id="stage"><div class="world" id="world"><canvas class="ink" id="ink" width="6000" height="4000"></canvas></div></div></div>
<div class="leftbar"><button class="tool active" data-tool="select">↖</button><button class="tool" data-tool="pan">✋</button><button class="tool" data-tool="pen">✏️</button><button class="tool" data-tool="marker">🖍️</button><button class="tool" data-tool="eraser">⌫</button><button class="tool" id="textBtn">T</button><button class="tool" id="stickyBtn">🗒</button><button class="tool" id="imageBtn">🖼</button><button class="tool" id="widgetBtn">＋</button></div>
<div class="bottombar"><button class="pill" id="undoBtn">↶</button><button class="pill" id="redoBtn">↷</button><button class="pill" id="fitBtn">⌗ Alles</button><select class="pill" id="bg"><option value="">Punkte</option><option value="lined">Liniert</option><option value="grid">Kariert</option><option value="boardgreen">Tafel</option></select><input id="color" type="color" value="#6d4d73"><select class="pill" id="width"><option>2</option><option selected>4</option><option>8</option><option>14</option></select></div><div class="zoom"><button class="pill" id="zoomOut">−</button><span class="pill" id="zoomLabel">75%</span><button class="pill" id="zoomIn">+</button></div>
<div class="panel hidden" id="studentsPanel"><h2>Klassenraum</h2><p id="roomInfo">Noch kein Raum gestartet.</p></div>
<div class="panel hidden" id="widgetPanel"><h2>✨ Kathleen Widgets</h2><div class="grid">
<button class="widgetChoice" data-add="calendar">📅<span>Kalender</span></button><button class="widgetChoice" data-add="clock">🕒<span>Uhr</span></button><button class="widgetChoice" data-add="dice">🎲<span>Würfel</span></button><button class="widgetChoice" data-add="countdown">🗓️<span>Countdown</span></button><button class="widgetChoice" data-add="embed">⌘<span>Embed</span></button><button class="widgetChoice" data-add="teams">👥<span>Gruppen</span></button><button class="widgetChoice" data-add="link">🔗<span>Link</span></button><button class="widgetChoice" data-add="image">🖼️<span>Bild</span></button><button class="widgetChoice" data-add="pdf">📄<span>PDF</span></button><button class="widgetChoice" data-add="poll">📊<span>Poll</span></button><button class="widgetChoice" data-add="qr">▦<span>QR</span></button><button class="widgetChoice" data-add="random">🎯<span>Randomizer</span></button><button class="widgetChoice" data-add="score">🏆<span>Scoreboard</span></button><button class="widgetChoice" data-add="sticker">💖<span>Sticker</span></button><button class="widgetChoice" data-add="stopwatch">⏱️<span>Stoppuhr</span></button><button class="widgetChoice" data-add="sound">🎙️<span>Lautstärke</span></button><button class="widgetChoice" data-add="timetable">🗓<span>Stundenplan</span></button><button class="widgetChoice" data-add="timer">⌛<span>Timer</span></button><button class="widgetChoice" data-add="traffic">🚦<span>Ampel</span></button><button class="widgetChoice" data-add="video">▶️<span>Video</span></button><button class="widgetChoice" data-add="visual">◔<span>Visual Timer</span></button><button class="widgetChoice" data-add="work">🤫<span>Arbeitssymbole</span></button><button class="widgetChoice" data-add="task">📝<span>Auftrag</span></button>
</div></div><input type="file" id="imageInput" accept="image/*" hidden><input type="file" id="pdfInput" accept="application/pdf" hidden><div class="toast" id="toast"></div><script src="board-app.js"></script></body></html>
