<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Klassenraum · Kathleens Kiste</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"SF Pro Rounded",Arial;background:linear-gradient(135deg,#fff7fc,#f2efff);color:#503d51;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #eadde9;border-radius:24px;padding:20px;box-shadow:0 18px 50px rgba(80,50,80,.1)}h1{font-size:34px;margin:0 0 5px}.sub{color:#8d788f}.field{margin:14px 0}label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;color:#8d788f;margin-bottom:5px}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:13px;border:1px solid #eadde9;border-radius:13px;background:#fffafd;color:#503d51}button{border:1px solid #eadde9;background:#fff;border-radius:13px;padding:12px 14px;font-weight:900;color:#503d51}.primary{border:0;color:#fff;background:linear-gradient(135deg,#e996bd,#aa91df);width:100%}.hidden{display:none!important}.lock{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,#654d68,#9276a6);color:#fff;display:grid;place-items:center;text-align:center;padding:30px}.lock .icon{font-size:70px}.msg{padding:18px;background:#fff0f7;border-radius:18px;font-size:22px;font-weight:900}.status{display:flex;gap:8px;align-items:center;font-size:12px;color:#8d788f}.dot{width:10px;height:10px;border-radius:50%;background:#58b382}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.actions button{min-height:70px}.canvas{height:52vh;border-radius:18px;background:#fff;background-image:radial-gradient(#d9cbd8 1px,transparent 1px);background-size:22px 22px;margin-top:14px;position:relative;overflow:hidden;touch-action:none}.banner{position:absolute;top:12px;left:12px;right:12px;background:#fff;padding:10px;border-radius:12px;box-shadow:0 8px 24px #0001;font-weight:800}@media(max-width:600px){.actions{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><section class="card" id="join"><h1>✨ Klassenraum</h1><p class="sub">Mit Kathleens Unterricht verbinden.</p><div class="field"><label>Raumcode</label><input id="code" maxlength="6" autocomplete="off" placeholder="ABC123"></div><div class="field"><label>Dein Name</label><select id="name"><option>Nach Raumcode verfügbar</option></select></div><button class="primary" id="joinBtn">Beitreten</button></section><section class="card hidden" id="room"><div class="status"><i class="dot"></i><b id="who">Verbunden</b><span>·</span><span id="phase">Freie Phase</span></div><div class="msg hidden" id="teacherMsg"></div><div class="canvas"><div class="banner" id="task">Warte auf den Arbeitsauftrag …</div></div><div class="actions"><button data-state="done">✓ Fertig</button><button data-state="help">? Hilfe</button><button data-state="unsure">🟡 Unsicher</button></div></section></main><div class="lock hidden" id="lock"><div><div class="icon">👀</div><h1>Bitte nach vorne schauen</h1><p>Kathleen gibt gleich wieder frei.</p></div></div><script>(()=>{const $=s=>document.querySelector(s);const q=new URLSearchParams(location.search);$('#code').value=(q.get('room')||'').toUpperCase();let token=localStorage.getItem('kathleenStudentToken')||crypto.randomUUID();localStorage.setItem('kathleenStudentToken',token);$('#joinBtn').onclick=()=>{const code=$('#code').value.trim().toUpperCase(),name=$('#name').value;if(code.length<4)return alert('Bitte Raumcode eingeben.');sessionStorage.setItem('kathleenRoom',code);sessionStorage.setItem('kathleenStudentName',name);$('#who').textContent=name;$('#join').classList.add('hidden');$('#room').classList.remove('hidden')};document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-state]').forEach(x=>x.style.opacity='.45');b.style.opacity='1'});})();</script></body></html>
