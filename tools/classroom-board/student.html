<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f8f3fa"><title>Klassenraum · Kathleens Kiste</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-rounded,"SF Pro Rounded",Arial;color:#503d51;background:#f8f3fa;overscroll-behavior:none}button,input{font:inherit}.joinWrap{max-width:620px;margin:7vh auto;padding:18px}.card{background:#fff;border:1px solid #eadde9;border-radius:25px;padding:22px;box-shadow:0 18px 55px #503d5118}.card h1{margin:0 0 5px}.card p{color:#8d788f}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;color:#8d788f;margin-bottom:5px}.field input{width:100%;padding:13px;border:1px solid #eadde9;border-radius:13px;font-size:16px}.btn{border:1px solid #eadde9;background:#fff;border-radius:13px;padding:11px 13px;font-weight:900;color:#503d51}.primary{border:0;color:#fff;background:linear-gradient(135deg,#e996bd,#aa91df)}.join{width:100%}.hidden{display:none!important}.room{height:100%;display:grid;grid-template-rows:58px 1fr 82px}.top{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#fff;border-bottom:1px solid #eadde9;z-index:10;overflow-x:auto}.connection{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:900;color:#8d788f}.dot{width:9px;height:9px;border-radius:50%;background:#c66;flex:0 0 auto}.dot.online{background:#58b382}.phase{font-weight:900;white-space:nowrap}.traffic{margin-left:auto;width:25px;height:25px;border-radius:50%;background:#59b887;flex:0 0 auto}.boardViewport{position:relative;overflow:hidden;background:#eee8ef;touch-action:none}.world{position:absolute;width:6000px;height:4000px;transform-origin:0 0;background:#fff;background-image:radial-gradient(#d9cbd8 1.2px,transparent 1.2px);background-size:24px 24px}.world.lined{background-image:repeating-linear-gradient(#fff 0,#fff 31px,#eadde9 32px)}.world.grid{background-image:linear-gradient(#eadde9 1px,transparent 1px),linear-gradient(90deg,#eadde9 1px,transparent 1px);background-size:32px 32px}.world.boardgreen{background:#315b4b}.item{position:absolute;border-radius:16px;overflow:hidden}.sticky{background:#fff0a9}.textitem{background:#fff}.widget{background:#fff;border:1px solid #eadde9}.body{padding:10px}.ink{position:absolute;inset:0;width:6000px;height:4000px}.tools{display:flex;gap:7px;align-items:center;padding:10px;background:#fff;border-top:1px solid #eadde9;overflow-x:auto;min-width:0}.tools .state{min-width:92px;height:54px}.state.active{background:#f1e7f6;border-color:#b99acb}.msg{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:30;background:#fff0f7;border:1px solid #e996bd;padding:14px 18px;border-radius:16px;font-weight:900;box-shadow:0 12px 30px #0002;max-width:calc(100vw - 28px)}.lock{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#654d68,#9276a6);color:#fff;display:grid;place-items:center;text-align:center;padding:20px}.lock .icon{font-size:78px}.writeBadge,.followBadge{font-size:10px;font-weight:900;padding:6px 8px;border-radius:99px;background:#f1eaf5;white-space:nowrap}.writeBadge.on{background:#dff5e9;color:#347356}.followBadge.on{background:#eee8ff;color:#6c58a0}.zoomTools{display:flex;gap:4px}.zoomTools button{min-width:42px}.reconnect{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);z-index:40;background:#5e4962;color:#fff;border-radius:999px;padding:8px 12px;font-size:10px;font-weight:900;box-shadow:0 8px 25px #0002}@media(max-width:700px){.room{grid-template-rows:55px 1fr 78px}.top{padding-left:7px;padding-right:7px}.top #who{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phase{font-size:11px}.tools{padding:8px}.tools .state{min-width:80px;font-size:10px}.writeBadge,.followBadge{font-size:9px}}
</style></head><body><section class="joinWrap" id="join"><div class="card"><h1>✨ Klassenraum</h1><p>Mit Kathleens Unterricht verbinden.</p><div class="field"><label>Raumcode</label><input id="code" maxlength="6" autocomplete="off" placeholder="ABC123"></div><div class="field"><label>Dein Name</label><input id="name" autocomplete="name" placeholder="Vor- und Nachname"></div><button class="btn primary join" id="joinBtn">Beitreten</button></div></section>
<section class="room hidden" id="room"><header class="top"><div class="connection"><i class="dot" id="onlineDot"></i><span id="connectionText">verbinden …</span></div><b id="who">Verbunden</b><span class="phase" id="phase">Freie Phase</span><span class="writeBadge" id="writeBadge">Nur ansehen</span><span class="followBadge" id="followBadge">Freie Ansicht</span><i class="traffic" id="traffic"></i></header><main class="boardViewport" id="viewport"><div class="world" id="world"><canvas class="ink" id="teacherInk" width="6000" height="4000"></canvas><canvas class="ink" id="studentInk" width="6000" height="4000"></canvas></div></main><footer class="tools"><button class="btn state" data-state="done">✓ Fertig</button><button class="btn state" data-state="help">? Hilfe</button><button class="btn state" data-state="unsure">🟡 Unsicher</button><input id="penColor" type="color" value="#6d4d73"><div class="zoomTools"><button class="btn" id="zoomMinus">−</button><button class="btn" id="zoomPlus">＋</button></div><button class="btn" id="clearLocal">↶ Letzter Strich</button><button class="btn" id="fullscreenBtn">⛶</button></footer></section>
<div class="msg hidden" id="teacherMsg"></div><div class="reconnect hidden" id="reconnect">Verbindung wird wiederhergestellt …</div><div class="lock hidden" id="lock"><div><div class="icon">👀</div><h1>Bitte nach vorne schauen</h1><p>Kathleen gibt gleich wieder frei.</p></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),SB='https://fzqxnjhuvgpgovcovosl.supabase.co/rest/v1/rpc/',KEY='sb_publishable_GIyyWoyaQXipaA4S9OuTyQ_cZn7LUgV',world=$('#world'),vp=$('#viewport'),tc=$('#teacherInk'),sc=$('#studentInk'),tctx=tc.getContext('2d'),sctx=sc.getContext('2d');async function rpc(n,b){const r=await fetch(SB+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})});const x=await r.json().catch(()=>null);if(!r.ok)throw new Error(x?.message||'Fehler');return x}
const q=new URLSearchParams(location.search);$('#code').value=(q.get('room')||localStorage.getItem('kathleenLastRoom')||'').toUpperCase();$('#name').value=localStorage.getItem('kathleenStudentName')||'';let device=localStorage.getItem('kathleenStudentDevice')||crypto.randomUUID(),token=sessionStorage.getItem('kathleenStudentToken')||'',canWrite=false,follow=false,scale=.55,tx=-450,ty=-300,drawing=false,current=null,lastMsg=0,ownStrokes=[],pollTimer=null,lastBoard='',lastOk=0;localStorage.setItem('kathleenStudentDevice',device);
function transform(v){if(v&&follow){scale=Number(v.scale)||scale;tx=Number(v.tx)||tx;ty=Number(v.ty)||ty}world.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'}
function draw(ctx,strokes){ctx.clearRect(0,0,6000,4000);ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes||[]){ctx.beginPath();ctx.strokeStyle=s.color||'#6d4d73';ctx.lineWidth=s.width||4;ctx.globalAlpha=s.alpha??1;(s.points||[]).forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}ctx.globalAlpha=1}
function renderBoard(b){if(!b)return;const key=JSON.stringify(b);if(key===lastBoard)return;lastBoard=key;world.className='world '+(b.bg||'');world.querySelectorAll('.item').forEach(e=>e.remove());for(const o of b.items||[]){const e=document.createElement('div');e.className='item '+(o.type==='sticky'?'sticky':o.type==='text'?'textitem':'widget');e.style.cssText='left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;height:'+o.h+'px;transform:rotate('+(o.rotation||0)+'deg);z-index:'+(o.z||0);e.innerHTML='<div class="body">'+o.html+'</div>';world.appendChild(e)}draw(tctx,b.strokes||[])}
function setConnection(ok,text){$('#onlineDot').classList.toggle('online',ok);$('#connectionText').textContent=text;$('#reconnect').classList.toggle('hidden',ok)}
async function poll(){if(!token)return;try{const s=await rpc('classroom_student_state',{p_student_token:token});if(!s?.ok)throw Error('session');lastOk=Date.now();setConnection(true,'live');canWrite=!!s.can_write;follow=!!s.follow_teacher;$('#writeBadge').textContent=canWrite?'✏️ Schreiben':'Nur ansehen';$('#writeBadge').classList.toggle('on',canWrite);$('#followBadge').textContent=follow?'👀 Lehreransicht':'Freie Ansicht';$('#followBadge').classList.toggle('on',follow);$('#lock').classList.toggle('hidden',!s.locked);$('#phase').textContent=({explain:'Erklärung',solo:'Einzelarbeit',group:'Gruppenarbeit',class:'Klassenaufgabe',break:'Pause',free:'Freie Phase'})[s.phase]||s.phase;$('#traffic').style.background=({green:'#59b887',yellow:'#f2c75a',red:'#df6a75'})[s.traffic]||'#59b887';renderBoard(s.board_state);transform(s.viewport);const msgs=s.messages||[];if(msgs.length&&msgs[msgs.length-1].id!==lastMsg){const m=msgs[msgs.length-1];lastMsg=m.id;$('#teacherMsg').textContent=m.body;$('#teacherMsg').classList.remove('hidden');setTimeout(()=>$('#teacherMsg').classList.add('hidden'),6000)}if(s.session_state==='closed'){$('#lock').classList.remove('hidden');$('#lock h1').textContent='Unterricht beendet';$('#lock p').textContent='Du kannst dieses Fenster schließen.'}}catch(e){console.warn(e);setConnection(false,Date.now()-lastOk<7000?'neu verbinden …':'offline')}}
function beginPolling(){clearInterval(pollTimer);poll();pollTimer=setInterval(poll,1800)}
async function join(code,name){const j=await rpc('classroom_join',{p_room_code:code,p_display_name:name,p_device_token:device});if(!j.ok)throw Error(j.error||'join');token=j.student_token;sessionStorage.setItem('kathleenStudentToken',token);localStorage.setItem('kathleenLastRoom',code);localStorage.setItem('kathleenStudentName',name);$('#who').textContent=name;$('#join').classList.add('hidden');$('#room').classList.remove('hidden');transform();beginPolling()}
$('#joinBtn').onclick=async()=>{const code=$('#code').value.trim().toUpperCase(),name=$('#name').value.trim();if(code.length!==6||!name)return alert('Bitte Raumcode und Namen eingeben.');try{await join(code,name)}catch(e){sessionStorage.removeItem('kathleenStudentToken');alert(e.message==='name_in_use'?'Dieser Name ist bereits auf einem anderen Gerät aktiv.':'Raum nicht gefunden oder Verbindung fehlgeschlagen.')}};
function p(e){const r=vp.getBoundingClientRect();return{x:(e.clientX-r.left-tx)/scale,y:(e.clientY-r.top-ty)/scale}}
sc.onpointerdown=e=>{if(!canWrite)return;drawing=true;current={color:$('#penColor').value,width:e.pointerType==='pen'?Math.max(2,4*(e.pressure||.5)):4,alpha:1,points:[p(e)]};sc.setPointerCapture(e.pointerId)};sc.onpointermove=e=>{if(!drawing)return;current.points.push(p(e));draw(sctx,[...ownStrokes,current])};sc.onpointerup=async()=>{if(!drawing)return;drawing=false;ownStrokes.push(current);draw(sctx,ownStrokes);try{await rpc('classroom_student_board_event',{p_student_token:token,p_payload:{type:'stroke',stroke:current}})}catch(e){ownStrokes.pop();draw(sctx,ownStrokes);setConnection(false,'Übertragung fehlgeschlagen')}current=null};$('#clearLocal').onclick=()=>{ownStrokes.pop();draw(sctx,ownStrokes)};
$$('[data-state]').forEach(b=>b.onclick=async()=>{if(!token)return;try{await rpc('classroom_student_update',{p_student_token:token,p_state:b.dataset.state});$$('[data-state]').forEach(x=>x.classList.toggle('active',x===b))}catch(e){setConnection(false,'Übertragung fehlgeschlagen')}});
let pan=null;vp.onpointerdown=e=>{if(canWrite||follow)return;pan={x:e.clientX,y:e.clientY,tx,ty};vp.setPointerCapture(e.pointerId)};vp.onpointermove=e=>{if(!pan)return;tx=pan.tx+e.clientX-pan.x;ty=pan.ty+e.clientY-pan.y;transform()};vp.onpointerup=()=>pan=null;$('#zoomPlus').onclick=()=>{if(follow)return;scale=Math.min(2.2,scale*1.18);transform()};$('#zoomMinus').onclick=()=>{if(follow)return;scale=Math.max(.18,scale/1.18);transform()};$('#fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
async function tryResume(){if(!token)return;try{const s=await rpc('classroom_student_state',{p_student_token:token});if(!s?.ok)throw Error();$('#who').textContent=localStorage.getItem('kathleenStudentName')||'Verbunden';$('#join').classList.add('hidden');$('#room').classList.remove('hidden');transform();beginPolling()}catch(e){sessionStorage.removeItem('kathleenStudentToken');token=''}}
tryResume()})();
</script></body></html>
